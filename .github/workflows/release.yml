name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Verify version consistency
        run: python tools/build_release.py --check-only
      - name: Build release
        run: python tools/build_release.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: log_monitor-release
          path: release/**
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $zip = Get-ChildItem release/log_monitor_v*.zip | Select-Object -First 1
          gh release create "${{ github.ref_name }}" release/log_monitor.exe $zip.FullName `
            --title "${{ github.ref_name }}" --generate-notes
