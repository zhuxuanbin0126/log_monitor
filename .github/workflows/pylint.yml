name: Pylint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint==4.0.8
          pip install -r requirements.txt
      # 阶段目标：先只拦截 E/F 级错误（语法、未定义名称等），逐步收紧
      - name: Analysing the code with pylint (errors only)
        run: |
          python -m pylint --rcfile=.pylintrc --errors-only business service ui tests main.py config.py device_config.py data_models.py
